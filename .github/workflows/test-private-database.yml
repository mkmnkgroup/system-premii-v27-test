name: Test public preview and isolated storage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v27_disposable_test
          POSTGRES_USER: test_runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test_runner -d v27_disposable_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_runner@localhost:5432/v27_disposable_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app_v2.py app_auth.py auth_rules.py role_views.py admin_users.py secure_draft_access.py workflow_drafts.py db_storage.py test_schedule_drafts.py monthly_publication.py month_publication_ui.py
      - run: python -m unittest discover -s tests -v

